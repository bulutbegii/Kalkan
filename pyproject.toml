[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalkan"
version = "0.1.0"
description = "ATT&CK / ATLAS haritali, kapsam ve denetim zorlamali guvenlik orkestrasyon cekirdegi"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kalkan = "kalkan.cli:main"

[tool.setuptools.packages.find]
include = ["kalkan*"]
